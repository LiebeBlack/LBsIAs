<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#08090d" />
    <meta name="application-name" content="Nexo by LBs IAs" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Nexo" />
    <title>Nexo by LBs IAs — todos los modelos de IA en un chat</title>
    <meta
      name="description"
      content="Nexo by LBs IAs es un espacio privado y bilingüe que habla con OpenAI, Anthropic, Google Gemini, OpenRouter, Groq, Mistral, DeepSeek y xAI. Compara respuestas, adjunta archivos y usa tus propias claves."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      // Aplica tema, idioma y acento antes del primer pintado para evitar destellos.
      try {
        var raw = localStorage.getItem('nexo.state.v1')
        var settings = raw ? JSON.parse(raw).settings || {} : {}
        var theme = settings.theme || 'dark'
        var dark = theme === 'dark' || (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        if (settings.accent) document.documentElement.style.setProperty('--accent', settings.accent)
        var languages = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || 'es']
        var detected = String(languages[0]).toLowerCase().indexOf('en') === 0 ? 'en' : 'es'
        var locale = settings.locale === 'es' || settings.locale === 'en' ? settings.locale : detected
        document.documentElement.lang = locale
      } catch (error) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
    <style>
      #root { height: 100%; }
      .boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 14px;
        background: #08090d;
        color: #eceef4;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      html[data-theme='light'] .boot { background: #f6f6f8; color: #17181d; }
      .boot-mark {
        display: grid;
        place-items: center;
        width: 54px;
        height: 54px;
        border-radius: 17px;
        color: #0a0b0e;
        background: linear-gradient(140deg, #8b6cff, #4be6c4);
        box-shadow: 0 18px 40px -18px rgba(139, 108, 255, 0.9);
      }
      .boot-name { margin: 4px 0 0; font-size: 15px; font-weight: 650; letter-spacing: -0.01em; }
      .boot-name span { display: block; font-size: 10.5px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.55; text-align: center; }
      .boot-tag { margin: 0; font-size: 12.5px; opacity: 0.55; }
      .boot-bar { width: 132px; height: 2px; margin-top: 8px; border-radius: 2px; background: rgba(139, 108, 255, 0.18); overflow: hidden; }
      .boot-bar::after { content: ''; display: block; width: 44%; height: 100%; border-radius: 2px; background: #8b6cff; animation: boot 1.1s ease-in-out infinite; }
      @keyframes boot { 0% { transform: translateX(-110%); } 100% { transform: translateX(330%); } }
      @media (prefers-reduced-motion: reduce) { .boot-bar::after { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" aria-hidden="true">
        <div class="boot-mark">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M12 4v16M4 12h16M6.5 6.5l11 11M17.5 6.5l-11 11" />
          </svg>
        </div>
        <p class="boot-name">Nexo <span>by LBs IAs</span></p>
        <p class="boot-tag">Un chat, todos los modelos.</p>
        <div class="boot-bar"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
